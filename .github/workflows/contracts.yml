name: Contract tests

on:
  push:
    branches: [main, feat/marketplace-v2-security-hardening-stacked]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Foundry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run contract tests
        run: forge test --gas-report
      - name: Validate deployment verifier syntax
        run: bash -n scripts/verify-base-deployment.sh
      - name: Verify declared Base deployment through public RPC
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: bash scripts/verify-base-deployment.sh
