name: VECTOLITH contract verification

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
      - "docs/SECURITY_REVIEW_NOTES.md"
  pull_request:
    paths:
      - "contracts/**"
      - "docs/SECURITY_REVIEW_NOTES.md"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

concurrency:
  group: vectolith-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable
      - name: Verify Solidity compilation
        working-directory: contracts
        run: forge build
      - name: Run registry, originals, and marketplace tests
        working-directory: contracts
        run: forge test --gas-report
      - name: Validate deployment verifier syntax
        working-directory: contracts
        run: bash -n scripts/verify-base-deployment.sh
      - name: Test runtime bytecode verifier
        working-directory: contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate runtime verifier syntax
        working-directory: contracts
        run: python3 -m py_compile scripts/verify-runtime-bytecode.py scripts/test_verify_runtime_bytecode.py
      - name: Verify declared Base deployment through public RPC
        working-directory: contracts
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: bash scripts/verify-base-deployment.sh
